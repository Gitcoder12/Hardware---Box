name: Hardware-Box CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }} · pytest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compile source and tests
        run: python -m compileall -q src tests
      - name: Validate example records
        run: |
          hardware-box validate database/devices/example-controller.json
          hardware-box validate examples/device-electrical.json
      - name: Run test suite
        run: python -m pytest tests/ -q
      - name: Check CLI entry point
        run: hardware-box --help

  streamlit-smoke:
    name: Streamlit startup check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and app dependencies
        run: |
          python -m pip install -e .
          python -m pip install -r requirements.txt
      - name: Start Streamlit
        run: |
          streamlit run streamlit_app.py --server.headless true --server.port 8501 --browser.gatherUsageStats false > streamlit.log 2>&1 &
          echo $! > streamlit.pid
      - name: Wait for application health endpoint
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then
              exit 0
            fi
            sleep 2
          done
          cat streamlit.log
          exit 1
      - name: Stop Streamlit
        if: always()
        run: |
          if [ -f streamlit.pid ]; then kill "$(cat streamlit.pid)" || true; fi
