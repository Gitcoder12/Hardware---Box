name: Streamlit app checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  app-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile app
        run: python -m py_compile streamlit_app.py
      - name: Start Streamlit and check health
        run: |
          streamlit run streamlit_app.py --server.headless true --server.port 8501 > /tmp/streamlit.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/streamlit.log
          exit 1
