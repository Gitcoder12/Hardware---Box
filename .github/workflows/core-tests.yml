name: Core toolkit checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore and verify v1.2.0 source
        run: python restore_core.py "$RUNNER_TEMP/hardware-box-core"
      - name: Install core and test dependencies
        run: python -m pip install -e "$RUNNER_TEMP/hardware-box-core[dev]"
      - name: Run core test suite
        working-directory: ${{ runner.temp }}/hardware-box-core
        run: python -m pytest -q
      - name: Build wheel
        run: python -m build "$RUNNER_TEMP/hardware-box-core" --wheel --outdir "$RUNNER_TEMP/dist"
      - name: Verify wheel artifact
        run: ls -lh "$RUNNER_TEMP/dist"
